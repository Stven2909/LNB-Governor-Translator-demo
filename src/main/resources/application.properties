# Contrato de despliegue Cloud Run (pagaduria-dev-lnb, us-central1). Los valores vienen de
# variables de entorno para desplegar sin recompilar; los :default mantienen el perfil mock
# ejecutable en local y en tests.
spring.application.name=worker-poc

# Puerto: explicito porque Cloud Run inyecta PORT. Sin esta linea el servicio arranca en 8080 por
# defecto, pero el contrato de despliegue queda implicito y no verificable.
server.port=${PORT:8080}

# Sondas: Cloud Run enruta trafico solo cuando /actuator/health/readiness responde OK, y reinicia
# la instancia si /actuator/health/liveness falla. Sin probes, una instancia con dependencias caidas
# sigue recibiendo mensajes.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
management.endpoints.web.exposure.include=health,info,metrics

# Seleccion de implementacion por componente. La PoC corre todo en modo simulado.
app.governor.mode=${APP_GOVERNOR_MODE:MOCK}
app.ingest.mode=${APP_INGEST_MODE:PUSH}
app.store.mode=${APP_STORE_MODE:MEMORY}
app.reporter.mode=${APP_REPORTER_MODE:MOCK}

# Limites de reintento (revision de Carlos, Bloque 1). Van aqui y no solo en codigo
# para que el nombre de la variable de entorno quede explicito y verificable en
# .env.example, igual que el resto de la configuracion de despliegue.
app.max-unknown-retries=${APP_MAX_UNKNOWN_RETRIES:3}
app.max-report-attempts=${APP_MAX_REPORT_ATTEMPTS:5}

# Vertex AI. project-id se inyecta por entorno: no hay credencial ni token en el repositorio.
app.vertex.project-id=${APP_VERTEX_PROJECT_ID:}
app.vertex.region=${APP_VERTEX_REGION:us-central1}
app.vertex.model=${APP_VERTEX_MODEL:gemini-2.5-flash}
app.vertex.prompt-version=${APP_VERTEX_PROMPT_VERSION:governor-v0.1}
app.vertex.timeout=${APP_VERTEX_TIMEOUT:30s}
app.vertex.max-attempts=${APP_VERTEX_MAX_ATTEMPTS:3}
app.vertex.backoff-base=${APP_VERTEX_BACKOFF_BASE:500ms}
app.vertex.max-input-chars=${APP_VERTEX_MAX_INPUT_CHARS:65536}
app.vertex.temperature=${APP_VERTEX_TEMPERATURE:0.0}

# Reporte a la API. El token se resuelve en runtime desde el nombre de variable de entorno.
app.report.base-url=${APP_REPORT_BASE_URL:}
app.report.result-path=${APP_REPORT_RESULT_PATH:/api/v1/integration/payment-committed}
app.report.timeout=${APP_REPORT_TIMEOUT:10s}
app.report.idempotency-header=${APP_REPORT_IDEMPOTENCY_HEADER:Idempotency-Key}
app.report.token-env-var=${APP_REPORT_TOKEN_ENV_VAR:REPORT_API_TOKEN}

# Sybase por JDBC (jConnect). Dependencia externa bloqueada: driver, VPN y credenciales.
app.jdbc.url=${APP_JDBC_URL:}
app.jdbc.driver-class-name=${APP_JDBC_DRIVER:com.sybase.jdbc4.jdbc.SybDriver}
app.jdbc.username=${APP_JDBC_USERNAME:}
app.jdbc.password-env-var=${APP_JDBC_PASSWORD_ENV_VAR:SYBASE_PASSWORD}
app.jdbc.timeout=${APP_JDBC_TIMEOUT:15s}
# Prohibido por diseno: un resultado JDBC UNKNOWN nunca se reejecuta, se concilia.
app.jdbc.retry-on-unknown=false
app.jdbc.max-attempts=${APP_JDBC_MAX_ATTEMPTS:3}

# Pub/Sub. Push es el modelo objetivo en Cloud Run; pull queda para pruebas locales.
app.pubsub.project-id=${APP_PUBSUB_PROJECT_ID:}
app.pubsub.subscription-id=${APP_PUBSUB_SUBSCRIPTION_ID:}
app.pubsub.dead-letter-topic-id=${APP_PUBSUB_DLQ_TOPIC_ID:}
app.pubsub.ack-deadline=${APP_PUBSUB_ACK_DEADLINE:60s}
app.pubsub.max-delivery-attempts=${APP_PUBSUB_MAX_DELIVERY_ATTEMPTS:5}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.pagaduriasintetica.worker=${LOG_LEVEL_WORKER:INFO}