# =============================================================================
# Cloud Build del Worker LNB — Caso 1 (agente de boleto + WS de tickets)
#
# Un solo artefacto, dos servicios Cloud Run:
#   caso1-ws     -> perfil "carlos", semilla activa, Sybase apagado
#   caso1-agente -> modo HTTP, apunta al WS por su URL publica
#
# El WS NO depende de Sybase para arrancar: en modo semilla sirve el contrato
# completo con provenance=SYNTHETIC y /status reporta poolActive=false. Por eso
# se puede desplegar y demostrar la ruta completa en Cloud Run antes de tener
# jconn4, IAM y credenciales de solo lectura.
#
# Valores de infraestructura tomados de lnb-docs/AMBIENTE_DEV_LNB.md:
#   - proyecto DEV:    proy-comercial-dev-lnb
#   - region:          us-central1
#   - Artifact Registry (Docker): cloud-run-source-deploy
#   - SA de build:     sa-build-agentes-dev-lnb@...
#   - SA de ejecucion: sa-run-agentes-dev-lnb@...
#   - Direct VPC:      vpc-comercial-dev-lnb-1 / subnet-comercial-dev-lnb-1
#
# SECRETOS: este archivo NO contiene valores ni inventa nombres. Los secretos de
# runtime se inyectan por REFERENCIA desde Secret Manager cuando el responsable
# confirme los nombres reales.
#
# NOTA DE ESCAPE: Cloud Build interpreta "$" como sustitucion. Las variables de
# shell se escriben con "$$" (por ejemplo $$WS_URL) para que lleguen intactas al
# script; sin eso el build falla con "invalid substitution".
#
# NOTA DE ENV: --set-env-vars separa las variables por comas, asi que ningun VALOR
# puede contener una coma. Por eso la exposicion de actuator se fija en un solo
# endpoint (health) y no en "health,info". Si hiciera falta mas de uno, corresponde
# mover la variable a --env-vars-file en lugar de forzar comas aqui.
# =============================================================================

substitutions:
  _REGION: us-central1
  _AR_REPO: cloud-run-source-deploy
  _IMAGE: worker-poc

  # Dos servicios desde la misma imagen. El nombre es estable y visible para el
  # equipo: es el que se publica en el acta junto con las URLs.
  _WS_SERVICE: caso1-ws
  _AGENT_SERVICE: caso1-agente

  # Service accounts de ejecucion. Hoy los dos servicios comparten la SA de run del
  # ambiente DEV para no meter un paso de IAM en el primer deploy: las SAs dedicadas
  # todavia no existen y referenciarlas haria fallar el build.
  #
  # Para el aislamiento definitivo (el agente con run.invoker SOLO sobre el WS):
  #   gcloud iam service-accounts create sa-run-caso1-ws     --project=proy-comercial-dev-lnb
  #   gcloud iam service-accounts create sa-run-caso1-agente --project=proy-comercial-dev-lnb
  #   gcloud run services add-iam-policy-binding caso1-ws \
  #     --member=serviceAccount:sa-run-caso1-agente@proy-comercial-dev-lnb.iam.gserviceaccount.com \
  #     --role=roles/run.invoker --region=us-central1
  # y cambiar estas dos lineas por las SAs nuevas. No se hace aqui porque crear SAs
  # es una accion de infraestructura, no de build.
  _WS_RUN_SA: sa-run-agentes-dev-lnb@proy-comercial-dev-lnb.iam.gserviceaccount.com
  _AGENT_RUN_SA: sa-run-agentes-dev-lnb@proy-comercial-dev-lnb.iam.gserviceaccount.com

  _VPC: vpc-comercial-dev-lnb-1
  _SUBNET: subnet-comercial-dev-lnb-1

  # Direct VPC egress: solo hace falta cuando exista el acceso a Sybase. Se deja
  # en false para que el primer deploy no dependa de la red privada ni de que la
  # subred ya exista; se activa con la misma sustitucion cuando llegue el pool.
  _ENABLE_VPC: "false"

  # Auth por servicio, no una bandera compartida: el estado final es WS privado y
  # agente alcanzable por Equipo 2. Con una sola bandera, cerrar el WS cerraria
  # tambien la unica puerta de entrada del caso.
  #
  # Para cerrar el WS (etapa 3 del cambio B) hay que mover las DOS a la vez:
  #   _WS_AUTH_FLAG:      no-allow-unauthenticated
  #   _AGENT_AUTH_TO_WS:  "true"
  # El agente toma el ID token del metadata server y su audiencia es la URL del WS
  # (auth-audience vacia => base-url). Ademas, la SA del agente necesita
  # roles/run.invoker sobre caso1-ws (comando en el bloque de SAs de arriba).
  # Si se cierra el WS sin activar el token, el agente recibe 403 y no hay dato.
  _WS_AUTH_FLAG: allow-unauthenticated
  _AGENT_AUTH_FLAG: allow-unauthenticated
  _AGENT_AUTH_TO_WS: "false"

  # Techo de instancias durante la ventana publica: limite de costo y de abuso.
  _MAX_INSTANCES: "2"

  # Actuator acotado. application.properties expone health,info,metrics; en un
  # servicio publico /actuator/metrics no aporta y si revela informacion operativa.
  # Se deja solo health, que es lo que necesita la sonda: /actuator/health/readiness
  # cuelga de ese endpoint, asi que el startup probe sigue funcionando.
  _ACTUATOR_EXPOSURE: health

  # Perfil de ejecucion del agente. FAKE evita depender de cuota de Vertex en la
  # demostracion; la logica de integracion (HTTP contra el WS) es la real.
  _TICKET_AGENT_MODEL_CLIENT: FAKE
  _TICKET_AGENT_PROVENANCE: SYNTHETIC
  _LOG_LEVEL_ROOT: INFO
  _LOG_LEVEL_WORKER: INFO

# La SA de build publica en Artifact Registry y despliega segun AMBIENTE_DEV_LNB.md.
serviceAccount: 'projects/proy-comercial-dev-lnb/serviceAccounts/sa-build-agentes-dev-lnb@proy-comercial-dev-lnb.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

steps:
  # ---------------------------------------------------------------------------
  # 1) Pruebas. Misma base JDK que el Dockerfile (fijada por digest) para que la
  #    version de Java/Maven no derive de otra imagen.
  # ---------------------------------------------------------------------------
  - id: test
    name: 'eclipse-temurin:21.0.6_7-jdk-jammy@sha256:42cafd5432c206408a7dbbc2a1d9523cd6277a5e1f618c379877002afd1bc0e2'
    entrypoint: bash
    args:
      - -c
      - |
        chmod +x mvnw
        ./mvnw -B -ntp test
    env:
      - 'MAVEN_OPTS=-Xmx512m -XX:MaxMetaspaceSize=384m'

  # ---------------------------------------------------------------------------
  # 2) Imagen unica. Se etiqueta con BUILD_ID (disponible tambien en builds
  #    manuales; SHORT_SHA solo existe en builds disparados por trigger).
  # ---------------------------------------------------------------------------
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}'
      - '--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest'
      - '.'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}'

  - id: push-latest
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest'

  # ---------------------------------------------------------------------------
  # 3) Servicio WS (rol E1: contrato de boletos de Carlos).
  #
  #    SPRING_PROFILES_ACTIVE=carlos activa application-carlos.properties, que
  #    fija server.port=${PORT:8085} (Cloud Run inyecta PORT=8080).
  #
  #    APP_SYBASE_TICKET_ENABLED=false es OBLIGATORIO y no un descuido: el perfil
  #    "carlos" trae enabled=true por defecto, y sin jconn4 en la imagen el pool
  #    falla al inicializar y el servicio entra en crashloop. Con la bandera en
  #    false el WS arranca en modo semilla y lo declara en /status.
  #
  #    El resto de los componentes (Governor, ingest, store, reporter) quedan en
  #    sus defaults MOCK/MEMORY de application.properties: no forman parte del
  #    Caso 1 y no se presentan como reales.
  #
  #    --min-instances=1 evita el cold start en la primera consulta: el agente
  #    aborta a los 15s y un arranque en frio del WS puede superarlo.
  # ---------------------------------------------------------------------------
  - id: deploy-ws
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VPC_FLAGS=""
        if [ '${_ENABLE_VPC}' = "true" ]; then
          VPC_FLAGS="--network=${_VPC} --subnet=${_SUBNET} --vpc-egress=private-ranges-only"
        fi
        gcloud run deploy '${_WS_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}' \
          --region='${_REGION}' \
          --platform=managed \
          --${_WS_AUTH_FLAG} \
          --port=8080 \
          --service-account='${_WS_RUN_SA}' \
          --min-instances=1 \
          --max-instances=${_MAX_INSTANCES} \
          --timeout=60s \
          --labels=caso=caso1,rol=ws,build=${BUILD_ID} \
          --startup-probe=httpGet.path=/actuator/health/readiness,initialDelaySeconds=5,timeoutSeconds=3,periodSeconds=5,failureThreshold=12 \
          --set-env-vars='SPRING_PROFILES_ACTIVE=carlos,APP_SYBASE_TICKET_ENABLED=false,APP_SYBASE_TICKET_SEED_ENABLED=true,APP_SYBASE_TICKET_PROVENANCE=SYNTHETIC,MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${_ACTUATOR_EXPOSURE},LOG_LEVEL_ROOT=${_LOG_LEVEL_ROOT},LOG_LEVEL_WORKER=${_LOG_LEVEL_WORKER}' \
          $VPC_FLAGS \
          --quiet

  # ---------------------------------------------------------------------------
  # 4) Servicio agente (rol E3.2: consulta al WS y devuelve el resultado).
  #
  #    La URL del WS no se conoce hasta el paso anterior, asi que se resuelve en
  #    tiempo de build con "gcloud run services describe" y se inyecta como
  #    APP_TICKET_AGENT_BASE_URL. Si el WS no expone URL, el build falla: un
  #    agente desplegado apuntando a la nada solo produce 502.
  #
  #    APP_TICKET_AGENT_MODE=HTTP es lo que impide que el agente responda desde
  #    fixtures. Dejarlo en FIXTURE produciria un servicio que "funciona" sin
  #    llamar a nadie, que es justo lo que hay que evitar.
  #
  #    APP_TICKET_AGENT_TIMEOUT=15s sube el default de 5s: el --timeout=60s de
  #    Cloud Run no protege al agente, que aborta por su propio cliente HTTP.
  # ---------------------------------------------------------------------------
  - id: deploy-agent
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        WS_URL=$$(gcloud run services describe '${_WS_SERVICE}' \
          --region='${_REGION}' --format='value(status.url)')
        if [ -z "$$WS_URL" ]; then
          echo "ERROR: ${_WS_SERVICE} no expone URL; no se despliega el agente"
          exit 1
        fi
        echo "WS_URL=$$WS_URL"
        gcloud run deploy '${_AGENT_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}' \
          --region='${_REGION}' \
          --platform=managed \
          --${_AGENT_AUTH_FLAG} \
          --port=8080 \
          --service-account='${_AGENT_RUN_SA}' \
          --max-instances=${_MAX_INSTANCES} \
          --timeout=60s \
          --labels=caso=caso1,rol=agente,build=${BUILD_ID} \
          --startup-probe=httpGet.path=/actuator/health/readiness,initialDelaySeconds=5,timeoutSeconds=3,periodSeconds=5,failureThreshold=12 \
          --set-env-vars="APP_TICKET_AGENT_MODE=HTTP,APP_TICKET_AGENT_BASE_URL=$$WS_URL,APP_TICKET_AGENT_TIMEOUT=15s,APP_TICKET_AGENT_MODEL_CLIENT=${_TICKET_AGENT_MODEL_CLIENT},APP_TICKET_AGENT_PROVENANCE=${_TICKET_AGENT_PROVENANCE},APP_TICKET_AGENT_AUTH_ENABLED=${_AGENT_AUTH_TO_WS},APP_SYBASE_TICKET_ENABLED=false,APP_SYBASE_TICKET_SEED_ENABLED=false,MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${_ACTUATOR_EXPOSURE},LOG_LEVEL_ROOT=${_LOG_LEVEL_ROOT},LOG_LEVEL_WORKER=${_LOG_LEVEL_WORKER}" \
          --quiet

  # ---------------------------------------------------------------------------
  # 5) URLs y revisiones. Es lo que se copia al acta y a ClickUp: sin estos dos
  #    datos la evidencia no es verificable por un tercero.
  # ---------------------------------------------------------------------------
  - id: urls
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for s in '${_WS_SERVICE}' '${_AGENT_SERVICE}'; do
          echo "=== $$s ==="
          gcloud run services describe "$$s" --region='${_REGION}' \
            --format='value(status.url,status.latestReadyRevisionName)'
        done
